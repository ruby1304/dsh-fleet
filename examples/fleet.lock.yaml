# Generated schema example. Production manifests belong in an owner-controlled
# configuration directory and should be rendered from a public team pack plus a
# private per-device overlay.
schemaVersion: 2
team:
  id: example-team
  name: Example DSH fleet

devices:
  controller:
    assignedTo: owner
    class: portable-control
    channel: stable
    labels: [macos, arm64]
  worker:
    assignedTo: owner
    class: always-on-worker
    channel: stable
    labels: [macos, arm64]

profileReleases:
  web-1.0.0:
    version: 1.0.0
    profile: web
    dshRange: ">=0.1.0-rc.7 <0.2.0"
    plugins:
      - id: dsh-example-public
        visibility: public
        source:
          kind: npm
          version: 1.0.0
          integrity: sha512-QUJDRA==
      - id: dsh-example-private
        visibility: private
        source:
          kind: artifact
          version: 1.0.0
          digest: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

assignments:
  worker:
    web: web-1.0.0
