# Public example only. Copy this file to a private, owner-controlled location.
# Replace every example source and path; never commit a production manifest.
schemaVersion: 1
team:
  id: example-team
  name: Example DSH fleet

devices:
  controller:
    assignedTo: owner
    class: portable-control
    channel: dev
    labels: [macos, arm64]
  worker:
    assignedTo: owner
    class: always-on-worker
    channel: stable
    labels: [macos, arm64]

plugins:
  # Development inventory may describe a mutable local checkout. It cannot be
  # planned or applied to a stable device by the V1 Agent.
  - id: dsh-local-development-plugin
    spec: link:/opt/example/dsh-local-development-plugin
    profiles: [web]
    target: { devices: [controller] }

  # Stable npm convergence requires an exact semantic version.
  - id: dsh-turn-fork
    source: npm
    revision: 0.1.0
    profiles: [web]
    target: { devices: [worker] }

  # Stable GitHub convergence requires a full 40-character commit SHA. This is
  # a syntactically valid placeholder; replace it with a reviewed real commit.
  - id: dsh-example
    source: github:owner/dsh-example
    revision: 0123456789abcdef0123456789abcdef01234567
    profiles: [web]
    target: { devices: [worker] }
