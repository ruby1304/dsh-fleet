version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      dsh-contract:
        patterns:
          - "@deepseek-ai/*"
      production:
        dependency-type: production
      development-tooling:
        dependency-type: development
        exclude-patterns:
          - "@deepseek-ai/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
