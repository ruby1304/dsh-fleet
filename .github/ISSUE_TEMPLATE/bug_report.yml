name: Bug report
description: Report a reproducible non-security defect
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Do not include credentials, session content, SSH configuration, Agent state, real manifests, hostnames, usernames, IPs, or private paths.
  - type: input
    id: fleet_version
    attributes:
      label: dsh-fleet version
      placeholder: 0.4.2 candidate commit or tarball digest
    validations:
      required: true
  - type: input
    id: dsh_version
    attributes:
      label: DSH version
      placeholder: 0.1.0-rc.8
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and Node.js version
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Read-only Host/UI
        - Mutation-capable Agent
        - Build/package
        - Documentation/example
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
      description: Use synthetic device names and paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted error code
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, session data, host identity, private paths, manifests, and Agent state.
          required: true
        - label: This is not a security vulnerability.
          required: true
